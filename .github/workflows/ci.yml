name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests (no GPU / models)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          python -m altvoice profiles
          python -m altvoice models --profile 12gb-balanced --check
        continue-on-error: true
