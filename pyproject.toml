[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altvoice"
version = "0.1.0"
description = "Offline Windows voice input with context-aware Chinese ASR and natural multilingual translation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AltVoice contributors" }]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
audio = ["sounddevice>=0.4"]
asr-qwen = ["qwen-asr>=0.1"]
asr-sherpa = ["sherpa-onnx>=1.10"]
download = ["huggingface_hub>=0.36", "hf_xet>=0.1"]
llm = []
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
altvoice = "altvoice.cli:main"

[tool.setuptools.packages.find]
include = ["altvoice*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
